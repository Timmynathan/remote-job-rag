[project]
name = "naija-job-hunter"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Timmynathan", email = "oluwatimilehin.ilesanmi@pau.edu.ng" }
]
requires-python = ">=3.12"
dependencies = [
    "apscheduler>=3.11.3",
    "httpx>=0.28.1",
    "langchain-google-genai>=4.3.3",
    "langgraph>=1.2.10",
    "playwright>=1.62.0",
    "psycopg[binary]>=3.3.5",
    "pydantic>=2.13.4",
    "pypdf>=6.15.0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "reportlab>=5.0.1",
    "resend>=2.44.0",
    "streamlit>=1.61.1",
    "tavily-python>=0.7.27",
]

[project.scripts]
naija-job-hunter = "job_hunter.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/job_hunter"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.2",
]

[tool.pytest.ini_options]
# Add src/ to sys.path directly for test collection. uv's editable install
# occasionally marks its generated .pth file with the macOS "hidden" flag on
# reinstall, which site.py silently skips - this keeps `pytest` working
# regardless of that. If `uv run python -c "import job_hunter"` ever breaks
# the same way outside tests, fix with:
#   chflags nohidden .venv/lib/python3.12/site-packages/*.pth
pythonpath = ["src"]
